[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-analyser"
version = "0.1.0"
description = "Investment analysis tool for portfolio optimisation and backtesting"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Jochem Langen"}
]
keywords = ["investment", "portfolio", "analysis", "backtesting"]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "beautifulsoup4>=4.9.0",
    "lxml>=6",
    "requests>=2.26.0",
    "selenium>=4.0.0",
    "pyautogui>=0.9.53",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/JochemLangen/investment-analyser"
Repository = "https://github.com/JochemLangen/investment-analyser.git"
Documentation = "https://github.com/JochemLangen/investment-analyser"
"Bug Tracker" = "https://github.com/JochemLangen/investment-analyser/issues"

[tool.setuptools]
packages = ["investment_analyser"]

[tool.setuptools.package-dir]
investment_analyser = "src"

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "C", "B"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
